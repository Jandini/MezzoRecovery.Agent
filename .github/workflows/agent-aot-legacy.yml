name: Agent AOT publish and deploy (legacy / glibc 2.31)

# Publishes a Native AOT linux-x64 binary built inside an Ubuntu 20.04
# container so the binary only requires glibc >= 2.31 (Ubuntu 20.04+).
# The install script detects glibc at runtime and picks this binary when
# glibc < 2.32 is present.
#
# Secrets (Settings → Secrets and variables → Actions):
#   NUGET_TOKEN - PAT with read:packages (MezzoRecovery.TapeDrive from GitHub Packages)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}

jobs:
  publish-legacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display GitVersion
        run: |
          echo "::group::GitVersion"
          echo "SemVer:               ${{ steps.gitversion.outputs.semVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "::endgroup::"

      - name: Build mra inside Ubuntu 20.04 container (glibc 2.31)
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
          INFOVER: ${{ steps.gitversion.outputs.informationalVersion }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e SEMVER \
            -e INFOVER \
            -e NUGET_AUTH_TOKEN \
            -e GITHUB_OWNER \
            -e GITHUB_ACTOR \
            ubuntu:20.04 bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                curl ca-certificates clang zlib1g-dev libssl-dev libicu66 build-essential
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/local/dotnet
              export PATH=/usr/local/dotnet:$PATH
              export DOTNET_ROOT=/usr/local/dotnet
              SOURCE="https://nuget.pkg.github.com/${GITHUB_OWNER}/index.json"
              dotnet nuget add source "$SOURCE" \
                --name github \
                --username "${GITHUB_ACTOR}" \
                --password "${NUGET_AUTH_TOKEN}" \
                --store-password-in-clear-text \
                --valid-authentication-types basic
              dotnet restore /workspace/src/MezzoRecovery.Agent/MezzoRecovery.Agent.csproj -r linux-x64 -p:PublishAot=true
              OUTDIR=/workspace/out/linux-x64-legacy
              rm -rf "$OUTDIR"
              dotnet publish /workspace/src/MezzoRecovery.Agent/MezzoRecovery.Agent.csproj \
                --no-restore \
                -c Release \
                -r linux-x64 \
                /p:PublishAot=true \
                /p:IlcInstructionSet=base \
                /p:DisableGitVersionTask=true \
                "/p:Version=$SEMVER" \
                "/p:InformationalVersion=$INFOVER" \
                -o "$OUTDIR"
              if [ ! -f "$OUTDIR/mra" ]; then
                echo "Native AOT binary not found at $OUTDIR/mra. Published files:"
                ls -la "$OUTDIR"
                exit 1
              fi
              mv "$OUTDIR/mra" /workspace/out/mra-linux-x64-legacy
              rm -rf "$OUTDIR"
              chmod 755 /workspace/out/mra-linux-x64-legacy
              (cd /workspace/out && sha256sum mra-linux-x64-legacy > mra-linux-x64-legacy.sha256)
              chmod 644 /workspace/out/mra-linux-x64-legacy.sha256
            '

      - uses: actions/upload-artifact@v4
        with:
          name: mra-linux-legacy
          path: |
            out/mra-linux-x64-legacy
            out/mra-linux-x64-legacy.sha256

  deploy-legacy:
    runs-on: ubuntu-latest
    needs: publish-legacy
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mra-linux-legacy
          path: staged

      - name: Publish Agent
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOSTNAME }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PORT_RAW: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT_RAW:-22}"
          TARGET="/home/u318688167/domains/mezzorecovery.com/public_html/agent"

          SCP_OPTS=(
            -o StrictHostKeyChecking=no
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=5
            -o ConnectTimeout=30
            -P "${PORT}"
          )

          for attempt in $(seq 1 3); do
            echo "SCP attempt ${attempt}/3..."
            if sshpass -e scp "${SCP_OPTS[@]}" \
                staged/mra-linux-x64-legacy staged/mra-linux-x64-legacy.sha256 \
                "${FTP_USER}@${FTP_HOST}:${TARGET}/"; then
              echo "SCP succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "SCP failed (attempt ${attempt}/3)."
            [ "${attempt}" -lt 3 ] && sleep 10
          done

          echo "ERROR: SCP failed after 3 attempts."
          exit 1
