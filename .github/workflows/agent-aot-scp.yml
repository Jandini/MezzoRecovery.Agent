name: Agent AOT publish and deploy

# Publishes Native AOT linux-x64 binary plus install.sh and version metadata,
# then deploys to public_html/agent on every commit.
#
# Secrets (Settings → Secrets and variables → Actions):
#   NUGET_TOKEN - PAT with read:packages (MezzoRecovery.TapeDrive from GitHub Packages)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Install GitVersion 5.12
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Determine version
        id: gitversion
        run: |
          JSON=$(dotnet-gitversion /output json)
          extract() { jq -r ".$1" <<< "$JSON"; }
          {
            echo "semVer=$(extract SemVer)"
            echo "informationalVersion=$(extract InformationalVersion)"
          } >> "$GITHUB_OUTPUT"

      - name: Display GitVersion
        run: |
          echo "::group::GitVersion"
          echo "SemVer:               ${{ steps.gitversion.outputs.semVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "::endgroup::"

      - name: Restore
        run: dotnet restore "src/MezzoRecovery.Agent/MezzoRecovery.Agent.csproj" -r linux-x64 -p:PublishAot=true

      - name: Publish linux-x64 (AOT)
        run: |
          set -euo pipefail
          PUB="$GITHUB_WORKSPACE/out"
          OUTDIR="$PUB/linux-x64"
          rm -rf "$OUTDIR"
          mkdir -p "$PUB"
          dotnet publish "src/MezzoRecovery.Agent/MezzoRecovery.Agent.csproj" \
            --no-restore \
            -c Release \
            -r linux-x64 \
            /p:PublishAot=true \
            /p:DisableGitVersionTask=true \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} \
            -o "$OUTDIR"
          if [ ! -f "$OUTDIR/mra" ]; then
            echo "Native AOT binary not found at $OUTDIR/mra. Published files:"
            ls -la "$OUTDIR"
            exit 1
          fi
          mv "$OUTDIR/mra" "$PUB/mra-linux-x64"
          rm -rf "$OUTDIR"
          (cd "$PUB" && sha256sum mra-linux-x64 > mra-linux-x64.sha256)

      - name: Prepare install script and version metadata
        run: |
          PUB="$GITHUB_WORKSPACE/out"
          cp deploy/install.sh "$PUB/install"
          chmod +x "$PUB/install"
          printf '{"version":"%s","commit":"%s"}\n' "${{ steps.gitversion.outputs.semVer }}" "${{ github.sha }}" > "$PUB/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: mra-linux
          path: |
            out/install
            out/mra-linux-x64
            out/mra-linux-x64.sha256
            out/version.json

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mra-linux
          path: staged

      - name: Publish Agent
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOSTNAME }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PORT_RAW: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT_RAW:-22}"
          TARGET="/home/u318688167/domains/mezzorecovery.com/public_html/agent"

          SCP_OPTS=(
            -o StrictHostKeyChecking=no
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=5
            -o ConnectTimeout=30
            -P "${PORT}"
          )

          for attempt in $(seq 1 3); do
            echo "SCP attempt ${attempt}/3..."
            if sshpass -e scp "${SCP_OPTS[@]}" \
                staged/install staged/mra-linux-x64 staged/mra-linux-x64.sha256 staged/version.json \
                "${FTP_USER}@${FTP_HOST}:${TARGET}/"; then
              echo "SCP succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "SCP failed (attempt ${attempt}/3)."
            [ "${attempt}" -lt 3 ] && sleep 10
          done

          echo "ERROR: SCP failed after 3 attempts."
          exit 1
