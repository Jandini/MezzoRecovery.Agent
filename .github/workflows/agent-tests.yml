name: Agent unit tests

# Runs on every push. Restores MezzoRecovery.TapeDrive / MezzoRecovery.Tape from GitHub Packages
# the same way the publish workflows do.
#
# Secrets:
#   NUGET_TOKEN - PAT with read:packages

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Test
        run: dotnet test tests/MezzoRecovery.Agent.Tests/MezzoRecovery.Agent.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
